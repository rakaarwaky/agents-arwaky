name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff Lint check
        run: uv run ruff check src/ blender_mcp_addon/

      - name: Run Ruff Format check
        run: uv run ruff format --check src/ blender_mcp_addon/

      - name: Run Mypy Type check
        run: uv run mypy src/

      - name: Run Tests
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov=blender_mcp_addon \
            --cov-report=term \
            -v --tb=short

      - name: Build Blender MCP Addon ZIP
        run: uv run python scripts/build_addon.py

      - name: Build Python Package Distribution
        run: uv build

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blender_mcp_addon.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
