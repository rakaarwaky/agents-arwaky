name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install ruff
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck jq

      - name: Python compile check
        run: python -m compileall tools/

      - name: Ruff lint
        run: ruff check tools/ --ignore E501 || true

      - name: JSON validation
        run: |
          find tools -name "*.json" -not -path "*/node_modules/*" -exec jq empty {} +

      - name: Shellcheck
        run: |
          find tools -name "*.sh" -not -path "*/node_modules/*" -not -path "*/skills/*" -exec shellcheck -x {} + || true

      - name: aa check (internal gate)
        run: python3 tools/cli/arwaky.py check

      - name: Submodule integrity
        run: git submodule status
