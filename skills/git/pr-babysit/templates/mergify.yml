{# Mergify config template — role model: lint-arwaky #}
{# Generated by `pr-babysit setup`. Write to .github/workflows/mergify.yml. #}
{# Security: only PRs authored by `rakaarwaky` may enter the queue. #}
{# Every <...> is a placeholder. See references/grok/setup/step-0-template.md #}
{# for the placeholder table, the per-language examples, and validation. #}

defaults:
  queue_rule:
    # `merge` rather than `rebase` when GitHub Rulesets enforce
    # strict_required_status_checks_policy (rejects force-pushes).
    update_method: <merge|rebase>
    merge_method: <merge|squash|rebase>
    # Size against cold-cache CI duration, not warm local runs.
    checks_timeout: <duration>
    merge_conditions:
      # One check-success per CI check that must pass before merge.
      - check-success = <check-1>
      - check-success = <check-2>

merge_queue:
  max_parallel_checks: <N>
  status_comments: outcomes
  queue_controls_comment: true

merge_protections_settings:
  auto_merge_conditions:
    - base = <BASE_BRANCH>
    - -draft
    - -conflict
    - author = rakaarwaky
  post_comment: true
  reporting_method: check-runs

queue_rules:
  - name: default
    queue_conditions:
      - base = <BASE_BRANCH>
      - author = rakaarwaky

{% if include_priority_rules %}
priority_rules:
  - name: hotfixes-first
    conditions:
      - label = hotfix
    priority: high
    allow_checks_interruption: true
  - name: refactors-last
    conditions:
      - label = refactor
    priority: low
{% endif %}

pull_request_rules:
  - name: warn-on-conflicts
    conditions:
      - conflict
      - -merged
      - -closed
    actions:
      label:
        add:
          - conflict

{% if include_stale_cleanup %}
  - name: stale-cleanup
    conditions:
      - base = <BASE_BRANCH>
      - -merged
      - -closed
      - -label = stale
      - updated-at < 14 days ago
      - created-at < 30 days ago
    actions:
      comment:
        message: >
          This PR has been open for 30 days with no commits for 14. If you're
          still working on it, push a commit or leave a comment. Otherwise this
          PR will auto-close in 7 days.
      label:
        add:
          - stale

  - name: close-abandoned-stale
    conditions:
      - base = <BASE_BRANCH>
      - -merged
      - -closed
      - label = stale
      - updated-at < 7 days ago
    actions:
      close:
        message: 'Closed automatically — no activity for 7+ days after a stale warning.'
      label:
        remove:
          - stale
{% endif %}

{% if include_welcome_comment %}
  - name: welcome-new-pr
    conditions:
      - base = <BASE_BRANCH>
      - -merged
      - -closed
      - -label = stale
      - created-at < 5 minutes ago
    actions:
      comment:
        message: >
          Thanks for the PR! CI is running — the merge queue picks it up
          automatically once all checks pass.
{% endif %}

  # ── Auto-merge when CI passes [and approved] ────────────────────────────
  - name: auto-merge-queue
    conditions:
{% if required_approvals >= 1 %}
      - "#approved-reviews-by>=<required_approvals>"
{% endif %}
      - check-success-or-neutral=~ci
      - -draft
      - -closed
      - author = rakaarwaky
    actions:
      queue:
        name: default

  # ── Notify when a PR merges ─────────────────────────────────────────────
  - name: merged-notification
    conditions:
      - merged
      - base = <BASE_BRANCH>
    actions:
      comment:
        message: Merged via the merge queue. Thanks for the contribution!

scopes:
  source:
    files: {}