{# CI workflow template — generated by `pr-babysit setup` #}
{# Write to .github/workflows/ci.yml in the target repo. #}
{# Pick the job block for the detected language; drop the others. #}
{# Supported language placeholders: rust, python, typescript. #}
{# The final else-branch handles multi-workspace repos. #}
name: CI
on:
  push:
    branches: [<BASE_BRANCH>]
10→  pull_request:
    branches: [<BASE_BRANCH>]

jobs:
{% if language == "rust" %}
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lint-arwaky-cli
        run: |
          sudo curl -sSL https://github.com/rakaarwaky/lint-arwaky/releases/latest/download/lint-arwaky-cli -o /usr/local/bin/lint-arwaky-cli
          sudo chmod +x /usr/local/bin/lint-arwaky-cli
      - name: Run lint-arwaky
        run: lint-arwaky-cli scan

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
30→
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
{% elif language == "python" %}
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
40→    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install lint-arwaky-cli
        run: |
          sudo curl -sSL https://github.com/rakaarwaky/lint-arwaky/releases/latest/download/lint-arwaky-cli -o /usr/local/bin/lint-arwaky-cli
          sudo chmod +x /usr/local/bin/lint-arwaky-cli
      - name: Run lint-arwaky
        run: lint-arwaky-cli scan

  test:
    runs-on: ubuntu-latest
50→    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
{% elif language == "typescript" %}
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lint-arwaky-cli
60→        run: |
          sudo curl -sSL https://github.com/rakaarwaky/lint-arwaky/releases/latest/download/lint-arwaky-cli -o /usr/local/bin/lint-arwaky-cli
          sudo chmod +x /usr/local/bin/lint-arwaky-cli
      - name: Run lint-arwaky
        run: lint-arwaky-cli scan

  build:
    runs-on: ubuntu-latest
    steps:
70→      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
80→      - run: npm ci
      - run: npm test
{% else %}
  # Multi-workspace: detect the language at run time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lint-arwaky-cli
        run: |
          sudo curl -sSL https://github.com/rakaarwaky/lint-arwaky/releases/latest/download/lint-arwaky-cli -o /usr/local/bin/lint-arwaky-cli
          sudo chmod +x /usr/local/bin/lint-arwaky-cli
90→      - name: Run lint-arwaky
        run: lint-arwaky-cli scan

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect and test
100→        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test
          elif [ -f "pyproject.toml" ]; then
            pytest
          elif [ -f "package.json" ]; then
            npm test
          fi
{% endif %}
