name: Release

# Unified release pipeline: opens a PR to main, tags, builds, and publishes.
# Triggered by a tag push or manually via workflow_dispatch.
#
# Tag push:      test → build → smoke-test → provenance → publish
# Dispatch:      compute version → open PR → (on merge) tag → test → build → publish
#
# Adapt the placeholders:
#   <python-version>    : e.g. "3.14"  (or omit the uv/python setup for non-Python)
#   <uv-version>        : e.g. "latest"
#   <build-command>     : e.g. uv build | cargo build --release | npm run build
#   <cli-entry>         : e.g. <your-cli> --help | (leave empty for non-CLI)
#   <dist-dir>          : e.g. dist | target/release | (leave empty)
#   <release-files>     : e.g. dist/* | target/release/* | (leave empty)
#   <apt-packages>      : e.g. libegl1 libgl1 ffmpeg | (leave empty)
#   <test-command>      : e.g. pytest modules/ -q | cargo test | npm test
#   <setup-action>      : e.g. ./.github/actions/setup-env | actions/setup-node@v4

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type: patch | minor | major"
        required: false
        type: string
        default: "patch"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "<python-version>"
  UV_VERSION: "<uv-version>"

jobs:
  # ── PR branch: compute version, bump, open PR ────────────────────────────
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        uses: <setup-action>
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          # For Rust/Node, replace with:
          #   dtolnay/rust-toolchain@stable + Swatinem/rust-cache@v2
          #   actions/setup-node@v4 with node-version

      - name: Determine next version
        id: version
        run: |
          last_tag=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last_tag" ]; then
            base="0.0.0"
          else
            base="${last_tag#v}"
          fi
          IFS='.' read -r major minor patch <<< "$base"
          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          NEW="${major}.${minor}.${patch}"
          echo "new_version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEW}"

      - name: Bump version and changelog
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -f scripts/bump.sh ]; then
            bash scripts/bump.sh "$NEW_VERSION" --yes
          else
            # Fallback: stamp manually
            # Python: sed -i -E "s/^version *= *\"[^\"]*\"/version = \"${NEW_VERSION}\"/" pyproject.toml
            # Rust:   sed -i -E "s/^version *= *\"[^\"]*\"/version = \"${NEW_VERSION}\"/" Cargo.toml
            # Node:   npm version "${NEW_VERSION}" --no-git-tag-version
            echo "No bump.sh found — stamp version manually" >&2
            exit 1
          fi
          git add pyproject.toml Cargo.toml package.json uv.lock Cargo.lock package-lock.json CHANGELOG.md cliff.toml scripts/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v${NEW_VERSION}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          branch="release/v${VERSION}"
          git checkout -b "$branch"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --body "Automated release prep for v${VERSION}." \
            --label release

  # ── On merged release PR: create and push the tag ────────────────────────
  create-tag:
    name: Create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from PR title
        id: version
        run: |
          RAW_SUBJECT=$(git log -1 --format=%s "${{ github.event.pull_request.merge_commit_sha }}")
          VERSION=$(echo "$RAW_SUBJECT" | sed -E -e 's/^chore\(release\):[[:space:]]*v?//' -e 's/[[:space:]]*\(#[0-9]+\)$//' | xargs)
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.version.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${{ steps.version.outputs.tag }}"

  # ── Tag branch: test → build → smoke → provenance → publish ─────────────
  test:
    name: Release test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [open-release-pr]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: <setup-action>
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          apt-packages: <apt-packages>
          test-dependencies: 'true'

      - name: Run tests
        env:
          RUST_BACKTRACE: 1
        run: <test-command>

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: <setup-action>
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-project: 'false'

      - name: Verify lockfile
        run: |
          if [ -f uv.lock ]; then uv lock --check
          elif [ -f Cargo.lock ]; then cargo metadata --no-deps --format-version 1 >/dev/null
          elif [ -f package-lock.json ]; then npm ci --dry-run
          fi

      - name: Build
        run: <build-command>

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: <dist-dir>

  smoke-test:
    name: Smoke test entry point
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: <dist-dir>

      - name: Install and verify
        run: |
          # Python (uv):
          #   uv python install ${{ env.PYTHON_VERSION }} && uv venv .venv-release && uv pip install <dist-dir>/*.whl && .venv-release/bin/<cli-entry>
          # Rust:
          #   cargo install --path . --locked && <cli-entry>
          # Node:
          #   npm install -g <dist-dir>/*.tgz && <cli-entry>
          echo "Smoke test placeholder — replace with actual entry point check"
          exit 0

  provenance:
    name: Generate build provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: <dist-dir>

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "<dist-dir>/*"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [smoke-test, provenance]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: <dist-dir>

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: <release-files>
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}