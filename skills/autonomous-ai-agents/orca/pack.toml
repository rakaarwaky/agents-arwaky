# Orca nested pack

Opt-in for PR-8 DM1: the validator treats the sub-directories under this folder
as a single nested pack, suppressing `too-deep` for their SKILL.md files. The
pack is intentional — orca skills are developed, versioned, and shipped as a
unit and are not meant to appear at `<category>/orca-*/SKILL.md`.

## Sub-skill directories

- `orca` — single consolidated skill with per-scenario references:
  - `references/cli.md` — orca CLI interface (worktrees, terminals, repos, automations, artifacts, skill sharing, embedded browser)
  - `references/automations.md` — scheduled automations and cron jobs
  - `references/computer-use.md` — drive visible local app windows via `orca computer`
  - `references/emulator.md` — iOS Simulator orchestration
  - `references/emulator-android.md` — Android emulator
  - `references/linear.md` — Linear ticket management
  - `references/per-workspace-env.md` — per-workspace environment scaffolding
  - `references/orchestration.md` — multi-agent orchestration
